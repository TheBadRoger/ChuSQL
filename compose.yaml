# 启动数据库服务并持久化数据与日志。
name: chusql
services:
  server:
    image: ${CHUSQL_IMAGE:-chusql:local}
    build:
      context: .
      args:
        CHUSQL_VERSION: ${CHUSQL_VERSION:-26.10.2}
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 128
    cpus: 1.0
    environment:
      CHUSQL_ADMIN_USER: ${CHUSQL_ADMIN_USER:-root}
      CHUSQL_ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    secrets:
      - admin_password
    ports:
      - "${CHUSQL_BIND_ADDRESS:-127.0.0.1}:${CHUSQL_TCP_PORT:-7777}:7777"
    volumes:
      - data:/var/lib/chusql
      - logs:/var/log/chusql
      - ./docker/server.toml:/etc/chusql/server.toml:ro

secrets:
  admin_password:
    file: ${CHUSQL_ADMIN_PASSWORD_PATH:-./secrets/admin_password}

volumes:
  data:
  logs:
