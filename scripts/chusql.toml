# ChuSQL 全局配置。
#
# 整条链路共用这一份文件，按分区各管各的，互不影响：
#   数据库服务：[server]（TCP 监听地址、端口、单行上限、单次结果行数上限）
#     —— 只有它装入 chusql_core_storage 动态库并独占数据目录
#   Web / 命令行：[web]（账号口令、会话、分页上限、静态目录），都经 [server] 走
# 数据目录在 [storage] data_dir；这一行是安装时会替换的占位：
# 不写就按平台惯例（Windows %LOCALAPPDATA%\ChuSQL\data，
# Unix ${XDG_DATA_HOME:-$HOME/.local/share}/chusql/data）。
# 每一层只读自己那几段，读完就关，不长期占着文件句柄，别的层照样能读。
# 只有这一份文件说了算：没有任何环境变量覆盖。
# 位置是固定的：Windows 在 %APPDATA%\ChuSQL\chusql.toml，其它平台在
# $XDG_CONFIG_HOME/ChuSQL/chusql.toml（没设就是 ~/.config/ChuSQL/chusql.toml）。
# 想临时读别处，三个可执行文件都认命令行 --config <path>。

[page]
size = 4096

[btree]
order = 4

[buffer]
pool_size = 1024

[storage]
# 安装时被替换成实际数据目录（--data-dir / -DataDir）；不写就按平台惯例：
# Windows %LOCALAPPDATA%\ChuSQL\data，Unix ${XDG_DATA_HOME:-$HOME/.local/share}/chusql/data
data_dir = "../localdata"

# TCP 数据库服务（chusql-server）。单独一段，别层的进程不认识它、也不需要认识。
[server]
host = "127.0.0.1"
port = 7777
max_message = 1048576
max_rows = 1000

[log]
level = "info"

[web]
host = "127.0.0.1"
port = 7778
static_dir = "static"
# 管理员账号与口令。口令留空表示"只允许管理员免密登录"，普通账号一律不能登录。
user = "root"
password = ""
# 会话与登录限流
session_idle = 28800
session_max = 86400
login_max_attempts = 5
login_window = 300
# 请求与分页上限
body_limit = 65536
rows_per_page = 25
max_page_size = 500
max_rows = 1000
max_sql_length = 20000
